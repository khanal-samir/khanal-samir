name: Update contributions graph

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw graph from GitHub data
        run: python scripts/update_contributions.py -o assets/contributions.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a PAT (read:user) as secret GH_STATS_TOKEN to include private contributions.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git diff --staged --quiet || (git commit -m "chore: update contributions graph" && git push)
